<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f0a">
<title>Пиксель Футбол '95</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0b0f0a;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;color:#f2f2f2}
#c{position:fixed;left:0;top:0}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,6,.82);z-index:20;padding:12px}
.hidden{display:none!important}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;background:#141c12;border:4px solid #f2f2f2;box-shadow:0 0 0 4px #000,8px 8px 0 4px #000;padding:16px 16px 14px}
h1{font-size:clamp(22px,5vw,32px);letter-spacing:2px;line-height:1.05;text-transform:uppercase;color:#ffe14d;text-shadow:3px 3px 0 #000}
.sub{color:#9fbf98;font-size:12px;margin:6px 0 10px;letter-spacing:1px;text-transform:uppercase}
.lbl{font-size:11px;color:#9fbf98;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:0;background:#1f2a1c;border:3px solid #3c5236;color:#f2f2f2;font:inherit;font-size:14px;font-weight:700;padding:9px 6px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.opt.on{border-color:#ffe14d;background:#2c3a1f;color:#ffe14d}
.kit{width:14px;height:18px;display:inline-block;border:2px solid #000;flex:none}
.go{display:block;width:100%;margin-top:14px;background:#ffe14d;color:#111;border:3px solid #000;box-shadow:4px 4px 0 #000;font:inherit;font-weight:800;font-size:18px;padding:11px;text-transform:uppercase;letter-spacing:2px;cursor:pointer}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.go.alt{background:#1f2a1c;color:#f2f2f2;border-color:#3c5236}
.help{font-size:11px;line-height:1.55;color:#b8cdb2;margin-top:12px}
.help b{color:#ffe14d}
@media (max-height:480px){.ov{padding:6px}.panel{padding:10px 14px}h1{font-size:22px}h1 br{display:none}.sub{margin:2px 0 4px}.lbl{margin:6px 0 4px}.opt{padding:6px}.go{margin-top:8px;padding:8px;font-size:16px}.big{margin:6px 0 2px}.help{margin-top:8px;font-size:10px}}
.big{font-size:clamp(18px,4.5vw,26px);font-weight:800;margin:14px 0 4px;text-transform:uppercase}
.res{font-size:14px;color:#9fbf98;text-transform:uppercase;letter-spacing:1px}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#stick{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto;touch-action:none}
#base{position:absolute;width:162px;height:162px;margin:-81px 0 0 -81px;border:3px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.2);left:calc(110px + env(safe-area-inset-left));top:calc(100% - 106px - env(safe-area-inset-bottom))}
#knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.4);border:3px solid rgba(255,255,255,.75)}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid #000;box-shadow:0 4px 0 #000;font:inherit;font-weight:800;font-size:12px;color:#111;display:flex;align-items:center;justify-content:center;text-transform:uppercase;opacity:.85;touch-action:none}
#pad{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:212px;height:212px;pointer-events:none}
#pad .btn{width:88px;height:88px;border-radius:0;background:rgba(28,86,38,.32);border:2px solid rgba(6,26,10,.7);box-shadow:inset 0 0 0 2px rgba(127,211,107,.75),2px 2px 0 rgba(0,0,0,.5);color:#fff;font-size:13px;line-height:1.15;text-align:center;padding:4px;text-shadow:1px 1px 0 #000,0 0 3px #000;opacity:.85}
#pad .btn.down{transform:translate(3px,3px);box-shadow:inset 0 0 0 2px #c8ff9e,1px 1px 0 #000;background:rgba(58,140,64,.95);opacity:1}
#pad.def .btn{background:rgba(26,58,96,.32);box-shadow:inset 0 0 0 2px rgba(127,182,255,.75),2px 2px 0 rgba(0,0,0,.5)}
#pad.def .btn.down{background:rgba(50,100,160,.95);box-shadow:inset 0 0 0 2px #cfe4ff,1px 1px 0 #000}
#b1{left:0;top:0}#b2{right:12px;top:0}#b3{left:0;bottom:12px}#pad #b4{right:0;bottom:0;width:112px;height:112px;font-size:15px}
#b2.shoot{background:rgba(170,40,32,.45)!important;box-shadow:inset 0 0 0 2px rgba(255,154,138,.85),2px 2px 0 rgba(0,0,0,.5)!important}
#bPause{position:absolute;pointer-events:auto;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:44px;height:28px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);color:#fff;font:inherit;font-weight:800;font-size:13px}
.pulse{animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.35);box-shadow:0 0 0 5px rgba(255,225,77,.8),0 4px 0 #000}}
.notouch #stick,.notouch .btn{display:none}
/* ===== PES13-style menus ===== */
.scr{position:fixed;inset:0;z-index:20;overflow:hidden;color:#fff;font-family:Arial,Helvetica,sans-serif}
#home{background:radial-gradient(120% 95% at 50% 45%,rgba(0,0,0,.1),rgba(0,0,0,.72))}
.diag{position:absolute;inset:0;pointer-events:none}
.diag i{position:absolute;top:-25%;height:150%;transform:skewX(-30deg);border-left:3px solid rgba(74,156,255,.9);border-right:3px solid rgba(74,156,255,.9);background:rgba(3,12,32,.42)}
.diag i:nth-child(1){left:-20%;width:38%}.diag i:nth-child(2){left:36%;width:20%;background:rgba(0,0,0,.2)}.diag i:nth-child(3){left:80%;width:42%}
.logo{position:absolute;left:calc(16px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));font:900 italic clamp(15px,4.6vh,24px)/1 Arial,sans-serif;color:#ffe14d;text-shadow:2px 2px 0 #000;letter-spacing:1px}
.logo small{display:block;font:700 clamp(9px,2.5vh,12px)/1.2 Arial,sans-serif;color:#a9d0ff;letter-spacing:2px;margin-top:4px;font-style:normal}
.rb{position:absolute;left:calc(3% + env(safe-area-inset-left));right:0;top:21%;height:43%;min-height:140px;background:#5aaaff;clip-path:polygon(0 50%,48px 0,100% 0,100% 100%,48px 100%)}
.rbi{position:absolute;inset:4px 0 4px 6px;clip-path:polygon(0 50%,45px 0,100% 0,100% 100%,45px 100%);background:var(--hex),linear-gradient(180deg,#2876d6 0%,#15539f 46%,#0c3877 100%);display:flex;align-items:stretch}
.rbi:before{content:"";position:absolute;right:0;top:0;width:32%;height:58%;background:var(--hexg);-webkit-mask-image:linear-gradient(to left,#000 10%,transparent);mask-image:linear-gradient(to left,#000 10%,transparent);pointer-events:none}
.emb{flex:0 0 auto;width:clamp(96px,22vh,150px);margin-left:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.emb svg{width:62%;height:auto;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.45))}
.emb .el{font:900 italic clamp(12px,3.8vh,19px)/1 Arial,sans-serif;text-transform:uppercase;margin-top:6px;text-shadow:2px 2px 0 rgba(0,0,0,.5);text-align:center}
.emb .dots{font-size:8px;letter-spacing:2px;color:#cfe6ff;margin-top:3px}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:10px}
.rtitle{font:900 italic clamp(24px,10vh,54px)/1 Arial,sans-serif;text-transform:uppercase;text-shadow:3px 3px 0 rgba(0,0,0,.55);padding-bottom:6px;border-bottom:1px solid rgba(190,225,255,.55);margin-bottom:8px;white-space:nowrap}
.icons{display:flex;gap:clamp(2px,1vw,14px);align-items:flex-end;overflow:visible;padding-top:6px}
.hi{background:none;border:0;color:#fff;opacity:.55;display:flex;flex-direction:column;align-items:center;width:clamp(46px,13vh,78px);padding:2px 0 4px;cursor:pointer;transition:transform .12s,opacity .12s;position:relative}
.hi svg{width:62%;height:auto}
.hi span{font:700 clamp(7px,2.3vh,11px)/1.1 Arial,sans-serif;text-transform:uppercase;margin-top:4px;white-space:nowrap;letter-spacing:.3px}
.hi.on{opacity:1;transform:scale(1.14);filter:drop-shadow(0 0 6px #8fd0ff)}
.hi.on:after{content:"";position:absolute;bottom:-2px;left:20%;right:20%;height:3px;background:#ffe14d}
.hi.soon:before{content:"СКОРО";position:absolute;top:-2px;right:0;font:800 7px Arial;background:#ffe14d;color:#111;padding:1px 3px}
.under{position:absolute;left:calc(11% + env(safe-area-inset-left));top:calc(64% + 12px);right:8%}
.desc{font:700 clamp(12px,3.9vh,19px)/1.3 Arial,sans-serif;text-shadow:2px 2px 0 #000}
.hint{margin-top:clamp(6px,3vh,18px);display:flex;gap:18px}
.hint button{background:none;border:0;color:#fff;font:800 clamp(12px,3.6vh,17px) Arial,sans-serif;display:flex;align-items:center;gap:7px;text-shadow:2px 2px 0 #000;cursor:pointer}
.hint .ok:before{content:"";width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#a7f3a0,#22c55e 60%,#166534);border:2px solid #0a2a12}
.hint .nav{opacity:.8}
#sub{background:linear-gradient(180deg,rgba(3,10,26,.72),rgba(3,10,26,.9))}
.sh{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));height:clamp(44px,13vh,62px);background:#5aaaff;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.shi{position:absolute;inset:3px 0;background:var(--hex),linear-gradient(180deg,#2876d6,#0f4189);display:flex;align-items:center;gap:12px;padding-left:calc(18px + env(safe-area-inset-left))}
#shIcon{display:flex;height:66%;align-items:center}#shIcon svg{height:100%;width:auto}
.shi b{font:900 italic clamp(20px,7vh,34px)/1 Arial,sans-serif;text-transform:uppercase;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.sbody{position:absolute;top:calc(clamp(44px,13vh,62px) + 20px + env(safe-area-inset-top));bottom:calc(52px + env(safe-area-inset-bottom));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-content:start;padding-bottom:6px}
.pnl{position:relative;background:var(--hex),linear-gradient(180deg,rgba(24,82,165,.88),rgba(9,38,88,.92));border:2px solid #4a9cff;padding:10px 12px 12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.pnl.wide{grid-column:1/-1}
.ph{font:800 italic 12px/1.2 Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;color:#c3e2ff;border-left:4px solid #ffe14d;padding-left:7px;margin-bottom:8px}
.big{font:900 italic clamp(24px,7.5vh,40px)/1.05 Arial,sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.unit{font:700 12px/1.3 Arial,sans-serif;color:#a9d0ff;margin-left:4px;font-style:normal}
.muted{font:600 13px/1.45 Arial,sans-serif;color:#c3d8ef}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);font:700 13px Arial,sans-serif}
.kv:last-child{border-bottom:0}.kv b{font-style:italic;font-size:15px}
.bar{display:flex;height:10px;margin:8px 0 4px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.3)}
.bar i{display:block;height:100%}.bar .w{background:#22c55e}.bar .d{background:#facc15}.bar .l{background:#ef4444}
.favc{display:flex;align-items:center;gap:12px}
.crest{display:inline-block;width:38px;height:46px;flex:none;clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%);background:linear-gradient(135deg,var(--a) 0 42%,var(--b) 42% 58%,var(--a) 58%);vertical-align:middle}
.crest.s{width:16px;height:19px;margin-right:6px}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.t{text-align:center;padding:7px 3px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);font:700 10px/1.2 Arial,sans-serif;color:#b9c9dc}
.t i{display:block;font-style:normal;font-size:24px;line-height:1.2;filter:grayscale(1) opacity(.35)}
.t small{display:block;font-weight:600;font-size:9px;opacity:.75;margin-top:2px}
.t.got{border-color:#ffd24d;background:rgba(255,210,77,.14);color:#fff}.t.got i{filter:none}
.clubs{display:flex;gap:10px}
.club{flex:1;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.2);color:#fff;padding:10px;font:800 italic 16px Arial,sans-serif;text-transform:uppercase;cursor:pointer;text-align:left}
.club small{display:block;font:600 11px Arial;color:#a9d0ff;text-transform:none;font-style:normal}
.club.on{border-color:#ffe14d;background:rgba(255,225,77,.15)}
.bigbtn{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.5);background:linear-gradient(#ffe866,#f2bf00);color:#111;border:0;font:900 italic clamp(15px,4.6vh,20px) Arial,sans-serif;padding:12px 34px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);text-transform:uppercase;cursor:pointer}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1);font:700 14px Arial,sans-serif}
.srow:last-child{border-bottom:0}
.sel{display:flex;align-items:center;gap:6px}
.sel button{width:38px;height:34px;background:#0c3877;border:2px solid #4a9cff;color:#fff;font:900 14px Arial;cursor:pointer}
.sel b{min-width:130px;text-align:center;font:800 italic 15px Arial,sans-serif}
.hrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);font:700 13px Arial,sans-serif}
.hrow:last-child{border-bottom:0}.hrow .dt{color:#a9d0ff;font-size:11px}
.sc{font:900 italic 15px Arial;padding:2px 8px;min-width:54px;text-align:center}.sc.w{background:#15803d}.sc.d{background:#a16207}.sc.l{background:#b91c1c}
.back{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));background:none;border:0;color:#fff;font:800 16px Arial,sans-serif;display:flex;align-items:center;gap:8px;text-shadow:2px 2px 0 #000;cursor:pointer;padding:6px}
.back:before{content:"◀";display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#0c3877;font-size:11px;text-shadow:none}
.danger{background:#7f1d1d!important;border-color:#f87171!important;width:auto!important;padding:0 12px}
.hl{color:#ffe14d}
.wide-club{width:100%;margin-top:4px}.wide-club em{margin-left:auto;font:800 12px Arial;color:#ffe14d;font-style:normal;white-space:nowrap}
.stars{color:#ffd24d;letter-spacing:1px}
.row2{display:flex;gap:8px;margin-top:10px}.mini{flex:1;background:#0c3877;border:2px solid #4a9cff;color:#fff;font:800 13px Arial,sans-serif;padding:8px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab{background:#0c3877;border:2px solid #4a9cff;color:#cfe6ff;font:800 italic 13px Arial,sans-serif;padding:7px 12px;text-transform:uppercase;cursor:pointer}.tab.on{background:#ffe14d;border-color:#ffe14d;color:#111}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.cc{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.15);color:#fff;font:700 12px Arial,sans-serif;padding:7px 8px;text-align:left;cursor:pointer}
.cc span:not(.crest){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc b{font:900 italic 13px Arial;color:#ffe14d}.cc.on{border-color:#ffe14d;background:rgba(255,225,77,.16)}.cc:disabled{opacity:.3}
.xi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);font:700 13px Arial,sans-serif}
.pp{font:900 10px Arial;padding:2px 4px;min-width:26px;text-align:center}.pp.GK{background:#ca8a04}.pp.DEF{background:#1d4ed8}.pp.MID{background:#15803d}.pp.FWD{background:#b91c1c}
.pn{color:#a9d0ff;min-width:20px;text-align:right}.pm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl b{font-style:italic;color:#ffe14d}
.ov .panel{background:var(--hex),linear-gradient(180deg,rgba(24,82,165,.95),rgba(9,38,88,.97));border:3px solid #5aaaff;box-shadow:none;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));font-family:Arial,Helvetica,sans-serif}
.ov h1{color:#fff;font:900 italic clamp(22px,6vh,32px)/1.1 Arial,sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.5);border-left:5px solid #ffe14d;padding-left:10px}
.ov .go{background:linear-gradient(#ffe866,#f2bf00);border:0;box-shadow:none;font:900 italic 18px Arial,sans-serif;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.ov .go.alt{background:#0c3877;color:#fff;outline:2px solid #4a9cff;outline-offset:-2px;clip-path:none}
.ov .big{font:900 italic clamp(18px,5vh,28px) Arial,sans-serif}.ov .res{font:700 14px Arial,sans-serif;color:#c3e2ff}.ov .res.hl{color:#ffe14d}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>

<div id="ui" class="hidden">
  <div id="stick"><div id="base"><div id="knob"></div></div></div>
  <div id="pad">
    <button class="btn" id="b1">Вразрез</button>
    <button class="btn" id="b2">Вынос</button>
    <button class="btn" id="b3">Пас</button>
    <button class="btn" id="b4">Рывок</button>
  </div>
  <button id="bPause" aria-label="Пауза">II</button>
</div>

<div id="home" class="scr">
  <div class="diag"><i></i><i></i><i></i></div>
  <div class="logo">Пиксель Футбол '95<small>RETRO FOOTBALL</small></div>
  <div class="rb"><div class="rbi">
    <div class="emb" id="emb"><div id="embIcon"></div><div class="el" id="embLbl"></div><div class="dots">● ● ● ● ● ● ●</div></div>
    <div class="rbody"><div class="rtitle" id="rTitle"></div><div class="icons" id="icons"></div></div>
  </div></div>
  <div class="under"><div class="desc" id="desc"></div>
    <div class="hint"><button class="ok" id="homeGo">Выбрать</button></div></div>
</div>
<div id="sub" class="scr hidden">
  <div class="diag"><i></i><i></i><i></i></div>
  <div class="sh"><div class="shi"><span id="shIcon"></span><b id="shTitle"></b></div></div>
  <div class="sbody" id="sbody"></div>
  <button class="back" id="subBack">Назад</button>
</div>

<div id="pause" class="ov hidden">
  <div class="panel">
    <h1>Пауза</h1>
    <button class="go" id="resume">▶ Продолжить</button>
    <button class="go alt" id="sound">Звук: вкл</button>
    <button class="go alt" id="stickBtn">Джойстик: подвижный</button>
    <button class="go alt" id="quit">В меню</button>
  </div>
</div>

<div id="end" class="ov hidden">
  <div class="panel">
    <h1>Финальный свисток</h1>
    <div class="big" id="endScore"></div>
    <div class="res" id="endRes"></div>
    <div class="res hl" id="endTro" style="margin-top:6px"></div>
    <button class="go" id="again">↻ Реванш</button>
    <button class="go alt" id="toMenu">В меню</button>
  </div>
</div>

<div id="rotate" class="ov hidden">
  <div class="panel" style="text-align:center">
    <h1>↻</h1>
    <div class="big" style="font-size:18px">Поверни телефон горизонтально</div>
    <div class="res">Так поле видно намного лучше</div>
    <button class="go alt" id="rotOk">Играть так</button>
  </div>

const lum=h=>{const c=hexRgb(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255};
const cdist=(a,b)=>{const x=hexRgb(a),y=hexRgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
function makeKit(c,alt){const k={name:c.name,short:c.short,shirt:c.c1,trim:c.c2,shorts:c.sh,socks:c.so,pat:c.pat};
  if(alt===1){const l=lum(c.c1)>0.6;k.shirt=l?'#1f2a44':'#f4f4f4';k.trim=c.c1;k.shorts=k.shirt;k.socks=k.shirt;k.pat=''}
  else if(alt===2){k.shirt=c.c2;k.trim=c.c1;k.shorts=c.c1;k.socks=c.c2;k.pat=''}
  const gks=['#22a34a','#8b5cf6','#f59e0b','#0ea5e9','#ec4899'];k.gk=gks.sort((a,b)=>cdist(b,k.shirt)-cdist(a,k.shirt))[0];k.dot=k.shirt;return k}
const stars=v=>'★'.repeat(clamp(Math.round((v-62)/6),1,5))+'☆'.repeat(5-clamp(Math.round((v-62)/6),1,5));
const DIFF={easy:{react:0.75,tackle:0.2,shotErr:1.5,gk:0.55,spd:0.9},normal:{react:1,tackle:0.33,shotErr:1.1,gk:0.66,spd:0.98},hard:{react:1.3,tackle:0.48,shotErr:0.85,gk:0.78,spd:1.05}};
const MATE={react:1,tackle:0.28,shotErr:1,gk:0.68,spd:1};
const SKINS=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'],HAIRS=['#2b1a0e','#141414','#6b4423','#d9b55a','#8a5a2b','#141414'];

const settings={team:'LEE',opp:'MUN',len:3,diff:'normal',stick:'float'};
try{const sv=localStorage.getItem('pf95_stick');if(sv==='fixed'||sv==='float')settings.stick=sv}catch(e){}
let teams=[],all=[],ball=null,G=null,running=false,paused=false;
const inp={kx:0,ky:0,tx:0,ty:0,x:0,y:0,passHit:false,shootHit:false,shootRel:false,shootHeld:false,thruHit:false,thruHeld:false,sprintHeld:false,keys:{}};
const inpMag=()=>hyp(inp.x,inp.y);

/* ---------- helpers ---------- */
const wx=(t,fx)=>t.side>0?PX0+fx*PW:PX1-fx*PW, wy=fy=>PY0+fy*PH;
const rfx=(t,x)=>t.side>0?(x-PX0)/PW:(PX1-x)/PW;
const oppGoalX=t=>t.side>0?PX1:PX0, ownGoalX=t=>t.side>0?PX0:PX1;
const other=t=>t===teams[0]?teams[1]:teams[0];
const humanTeam=()=>teams.find(t=>t.human)||null;
const possTeam=()=>ball.owner?ball.owner.team:(ball.passTeam||null);
function nearestTo(t,pt,noGK,excl){let b=null,bd=1e9;for(const p of t.players){if((noGK&&p.role==='GK')||p===excl)continue;const d=dist(p,pt);if(d<bd){bd=d;b=p}}return b}
const nearestOpp=p=>nearestTo(other(p.team),p,false);
function segDist(o,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;const t=clamp(((o.x-a.x)*dx+(o.y-a.y)*dy)/l,0,1);return hyp(o.x-(a.x+dx*t),o.y-(a.y+dy*t))}
function laneBlocked(p,m){for(const o of other(p.team).players)if(segDist(o,ball,m)<7&&dist(o,p)>4)return true;return false}
function inOwnBox(p,pt){const f=rfx(p.team,pt.x);return f<0.135&&f>-0.03&&Math.abs(pt.y-GCY)<122}
function msg(t,d,big){G.msg={txt:t,t:d,big:!!big}}

function mkTeam(key,i){const c=CLUBS[key]||CLUBS.LEE;return{key:c.id,club:c,kit:makeKit(c,0),xi:xiOf(c.id),ovr:teamOvr(c.id),idx:i,score:0,side:1,human:false,ai:MATE,players:[],chaser:null,support:null}}
function adjAI(b,ovr,k){const f=clamp((ovr-78)/14,-1,1)*k;return{react:b.react*(1+0.15*f),tackle:clamp(b.tackle+0.07*f,0.08,0.7),shotErr:b.shotErr*(1-0.15*f),gk:clamp(b.gk+0.06*f,0.35,0.92),spd:b.spd*(1+0.04*f)}}
function mkPlayer(t,i){const f=FORM[i],x=t.xi[i];return{team:t,i,role:f[2],name:x.name,num:x.num,at:x,bx:f[0],by:f[1],x:0,y:0,vx:0,vy:0,tvx:0,tvy:0,face:0,anim:Math.random()*2,
  spd:(f[2]==='GK'?70:74)*(0.9+x.pac/520)*rnd(0.97,1.03),stun:0,fallen:0,kickCd:0,slide:0,sdx:0,sdy:0,tackleCd:0,decCd:0,dive:0,diveDir:1,hold:0,spx:null,spy:null,skin:pick(SKINS),hair:pick(HAIRS)}}

function newMatch(train){
  const hk=CLUBS[settings.team]?settings.team:'LEE';let ak=CLUBS[settings.opp]&&settings.opp!==hk?settings.opp:(hk==='MUN'?'LEE':'MUN');
  teams=[mkTeam(hk,0),mkTeam(ak,1)];teams[0].side=1;teams[1].side=-1;
  if(cdist(teams[0].kit.shirt,teams[1].kit.shirt)<140){teams[1].kit=makeKit(teams[1].club,1);if(cdist(teams[0].kit.shirt,teams[1].kit.shirt)<140)teams[1].kit=makeKit(teams[1].club,2)}
  teams.forEach(t=>{t.human=t.key===settings.team;t.ai=t.human?adjAI(MATE,t.ovr,0.5):adjAI(DIFF[settings.diff]||DIFF.normal,t.ovr,1);t.players=FORM.map((f,i)=>mkPlayer(t,i));});
  if(train)for(const t of teams)if(!t.human)t.players=[t.players[0]];
  all=[...teams[0].players,...teams[1].players];
  ball={x:CX,y:GCY,z:0,vx:0,vy:0,vz:0,owner:null,lastTouch:null,passTarget:null,passTeam:null,shot:false,shotTeam:null,saveChecked:false,spin:0};
  G={state:'kickoff',half:1,time:0,halfLen:train?Infinity:settings.len*60,training:!!train,mg:{},trailed:false,ctrl:null,charge:0,charging:false,msg:null,timer:0,sp:null,cam:{x:CX-W/2,y:GCY-H/2},
     firstKick:teams[0],prevOwnerTeam:null,switchCd:0,ended:false,stats:{shots:[0,0],goals:0,sp:0}};
  if(train)trainingReset();else setupKickoff(teams[0]);
}
function trainingReset(){const h=humanTeam()||teams[0],o=other(h);G.state='play';G.charging=false;G.q=null;G.timer=0;
  for(const p of all){resetP(p);if(p.team===h){p.x=wx(h,clamp(p.bx+0.25,0.08,0.82));p.y=wy(p.by)}else{p.x=ownGoalX(o)+o.side*6;p.y=GCY}}
  const tk=h.players[9];tk.x=wx(h,0.6);tk.y=GCY+rnd(-70,70);resetBall(tk.x+h.side*5,tk.y);take(tk);G.ctrl=tk;G.prevOwnerTeam=h;msg('ТРЕНИРОВКА',1.2)}

function resetBall(x,y){Object.assign(ball,{x,y,z:0,vx:0,vy:0,vz:0,owner:null,passTarget:null,passTeam:null,shot:false,saveChecked:false})}
function resetP(p){p.vx=p.vy=p.tvx=p.tvy=0;p.stun=0;p.slide=0;p.dive=0;p.fallen=0;p.kickCd=0;p.hold=0;p.spx=null;p.face=p.team.side>0?0:Math.PI}

function setupKickoff(kt){
  G.state='kickoff';G.timer=0;G.kickTeam=kt;G.charging=false;
  for(const t of teams)for(const p of t.players){let fx=p.bx,fy=p.by;
    if(p.role==='GK')fx=0.02;else if(p.role==='FWD'){fx=t===kt?0.49:0.4;if(t===kt)fy=p.i===9?0.5:0.44;}else fx=Math.min(fx*0.85,0.42);
    p.x=wx(t,fx);p.y=wy(fy);resetP(p);}
  const tk=kt.players[9];tk.x=CX-kt.side*5;tk.y=GCY;resetBall(CX,GCY);G.taker=tk;
  const h=humanTeam();if(h)G.ctrl=h===kt?tk:nearestTo(h,ball,true);
  G.prevOwnerTeam=null;msg('НАЧАЛО',1.6);
}

function homePos(p){
  const t=p.team,bf=clamp(rfx(t,ball.x),0,1),bfy=clamp((ball.y-PY0)/PH,0,1),att=possTeam()===t;
  let fx=p.bx+(bf-0.45)*0.6+(att?0.1:-0.02),fy=p.by*0.75+bfy*0.25;
  if(p.role==='DEF')fx=clamp(fx,0.07,0.62);else if(p.role==='MID')fx=clamp(fx,0.18,0.86);else fx=clamp(fx,0.3,0.92);
  if(!att)fy=0.5+(fy-0.5)*0.85;
  return{x:wx(t,fx),y:wy(clamp(fy,0.03,0.97))};
}
function interceptPoint(p){
  const b=ball;if(b.owner)return{x:b.owner.x+b.owner.vx*0.25,y:b.owner.y+b.owner.vy*0.25};
  const k=-Math.log(FRIC),s=p.spd*p.team.ai.spd;
  for(let t=0;t<=2;t+=0.08){const f=(1-Math.exp(-k*t))/k,x=b.x+b.vx*f,y=b.y+b.vy*f;if(hyp(x-p.x,y-p.y)/s<=t+0.05)return{x,y}}
  return{x:b.x+b.vx/k,y:b.y+b.vy/k};
}
function moveTo(p,tx,ty,sf){const dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy);if(d<1.5){p.tvx=p.tvy=0;return}
  const s=p.spd*p.team.ai.spd*sf*(ball.owner===p?0.88:1)*Math.min(1,d/10+0.25);p.tvx=dx/d*s;p.tvy=dy/d*s}

function assignRoles(t){
  const arr=t.players.filter(p=>p.role!=='GK'&&p.stun<=0&&p.slide<=0).sort((a,b)=>dist(a,ball)-dist(b,ball));
  let c=arr[0]||null,s=arr[1]||null;
  if(ball.passTarget&&ball.passTeam===t)c=null;
  if(t.human&&G.ctrl){if(c===G.ctrl){c=null;s=arr[1]||null}else if(s===G.ctrl)s=arr[2]||null}
  t.chaser=c;t.support=s;
}

/* ---------- kicking ---------- */
function kick(p,dx,dy,spd,vz){const b=ball;b.owner=null;b.vx=dx*spd;b.vy=dy*spd;b.vz=vz;b.lastTouch=p;p.kickCd=0.28;b.shot=false;b.saveChecked=false;b.passTarget=null;b.passTeam=null;b.hp=(p===G.ctrl);p.hold=0;p.face=Math.atan2(dy,dx);sfx.kick()}
function pass(p,m,mode='auto'){
  const lead=hyp(m.vx,m.vy)>20?0.45:0.2;
  const tx=clamp(m.x+m.vx*lead,PX0+4,PX1-4),ty=clamp(m.y+m.vy*lead,PY0+4,PY1-4);
  const dx=tx-ball.x,dy=ty-ball.y,d=hyp(dx,dy)||1;
  let lob=mode==='lob'||(mode==='auto'&&(d>190||laneBlocked(p,m)));if(mode==='ground'||mode==='throw')lob=false;
  let spd,vz;
  if(mode==='throw'){vz=55;spd=clamp(d*1.6,60,190);}
  else if(lob){vz=clamp(90+d*0.35,110,210);spd=d/(2*vz/GRAV)*0.92;}
  else{vz=0;spd=clamp(d*1.05+90,120,430);}
  const err=(p===G.ctrl?0:0.055)*(lob?1.5:1),a=Math.atan2(dy,dx)+gauss()*err;
  kick(p,Math.cos(a),Math.sin(a),spd,vz);ball.passTarget=m;ball.passTeam=p.team;
}
function shoot(p,power,aim){
  const t=p.team,gx=oppGoalX(t),ty=GCY+clamp(aim,-1,1)*(GOAL_HALF-5),dx=gx-ball.x,dy=ty-ball.y,d=hyp(dx,dy);
  const op=nearestOpp(p),pr=op&&dist(op,p)<14?0.05:0;
  const err=(0.04+power*0.08+pr)*(p===G.ctrl?0.9:t.ai.shotErr)*(1.35-(p.at?p.at.sho:70)/140),a=Math.atan2(dy,dx)+gauss()*err;
  let vz=(20+power*100)*clamp(d/170,0.45,1.15);if(power>0.92)vz+=rnd(0,60);
  kick(p,Math.cos(a),Math.sin(a),280+power*200,vz);ball.shot=true;ball.shotTeam=t;sfx.shot();G.stats.shots[t.idx]++;
}
function dirTarget(p,dx,dy){const m=hyp(dx,dy)||1;dx/=m;dy/=m;let best=null,bs=-1e9;
  for(const q of p.team.players){if(q===p||q.role==='GK')continue;const vx=q.x-p.x,vy=q.y-p.y,d=hyp(vx,vy);if(d<8||d>320)continue;const c=(vx*dx+vy*dy)/d;if(c<0.55)continue;const s=c*2.2-d/260;if(s>bs){bs=s;best=q}}return best}
function bestPassTarget(p,long){const t=p.team,maxD=long?330:270;let best=null,bs=-1e9;
  for(const q of t.players){if(q===p||q.role==='GK')continue;const d=dist(p,q);if(d<26||d>maxD)continue;
    const prog=(rfx(t,q.x)-rfx(t,p.x))*PW;let open=99,lane=99;for(const o of other(t).players){open=Math.min(open,dist(o,q));lane=Math.min(lane,segDist(o,p,q))}
    let s=prog*0.7+Math.min(open,45)*1.6-d*0.08+rnd(0,18);if(lane<7&&d<190)s-=90;if(open<10)s-=60;if(s>bs){bs=s;best=q}}
  return bs>-80?best:null}
function boxTarget(p){let best=null,bs=-1e9;for(const q of p.team.players){if(q===p||q.role==='GK')continue;if(rfx(q.team,q.x)<0.78||Math.abs(q.y-GCY)>110)continue;
  let open=99;for(const o of other(p.team).players)open=Math.min(open,dist(o,q));const s=open+rnd(0,10);if(s>bs){bs=s;best=q}}return best}

function take(p){const b=ball;b.owner=p;b.lastTouch=p;b.shot=false;b.passTarget=null;b.passTeam=null;b.vz=0;p.decCd=rnd(0.1,0.3);if(p.role==='GK'){p.hold=rnd(0.8,1.2);b.z=7}}
function tryTackle(p,chance){const o=ball.owner;if(!o||o.team===p.team||o.role==='GK'||p.tackleCd>0||dist(p,o)>9)return;
  p.tackleCd=rnd(0.45,0.8)/p.team.ai.react;
  if(Math.random()<(chance||p.team.ai.tackle)*(0.75+(p.at?p.at.def:60)/200)){o.stun=0.45;sfx.tackle();
    if(Math.random()<0.55)take(p);else{ball.owner=null;const a=Math.atan2(o.y-p.y,o.x-p.x)+rnd(-1,1);ball.vx=Math.cos(a)*90;ball.vy=Math.sin(a)*90;ball.lastTouch=p;p.kickCd=0.1;ball.passTeam=null;ball.passTarget=null}}}
function startSlide(p){if(p.slide>0||p.stun>0)return;const m=inpMag();let dx,dy;if(m>0.2){dx=inp.x/m;dy=inp.y/m}else{dx=Math.cos(p.face);dy=Math.sin(p.face)}
  p.slide=0.36;p.sdx=dx;p.sdy=dy;p.face=Math.atan2(dy,dx);nz(.18,.25,300)}
function updSlide(p,dt){p.slide-=dt;const k=0.6+0.5*Math.max(0,p.slide)/0.36;p.vx=p.sdx*165*k;p.vy=p.sdy*165*k;p.tvx=p.vx;p.tvy=p.vy;
  const o=ball.owner;
  if(dist(p,ball)<10&&ball.z<8&&o!==p&&!(o&&(o.team===p.team||o.role==='GK'))){if(o){o.stun=0.8;o.fallen=0.8}
    ball.owner=null;ball.vx=p.sdx*150+rnd(-30,30);ball.vy=p.sdy*150+rnd(-30,30);ball.vz=0;ball.lastTouch=p;ball.passTarget=null;ball.passTeam=p.team;ball.shot=false;p.kickCd=0.12;sfx.tackle()}
  if(p.slide<=0){p.slide=0;p.stun=0.3;p.vx*=0.2;p.vy*=0.2;p.tvx=p.tvy=0}}

/* ---------- AI ---------- */
function aiCarrier(p,dt){
  const t=p.team,s=t.side,gx=oppGoalX(t),fx=rfx(t,p.x),dGoal=hyp(gx-p.x,GCY-p.y),dy=Math.abs(p.y-GCY);
  const op=nearestOpp(p),od=op?dist(op,p):999;
  p.decCd-=dt;
  if(p.decCd<=0){p.decCd=rnd(0.18,0.4)/t.ai.react;
    if(dy<100&&(dGoal<115||(dGoal<175&&Math.random()<0.18))){const gk=other(t).players[0];shoot(p,rnd(0.45,0.85),(gk.y<GCY?1:-1)*rnd(0.35,0.95));return}
    if(fx>0.84&&dy>=85){const m=boxTarget(p);if(m&&Math.random()<0.6){pass(p,m,'lob');return}}
    const ahead=op&&(op.x-p.x)*s>-4,pp=od<16&&ahead?0.6:od<26?0.15:0.05;
    if(Math.random()<pp){const m=bestPassTarget(p);if(m){pass(p,m);return}}}
  let dx=s,dyv=(GCY-p.y)/PH*(fx>0.6?2.2:0.6);
  for(const o of other(t).players){const d=dist(o,p);if(d<34&&d>0.1&&(o.x-p.x)*s>-6)dyv+=(p.y-o.y)/d*(34-d)/34*1.6}
  const l=hyp(dx,dyv);dx/=l;dyv/=l;
  moveTo(p,clamp(p.x+dx*30,PX0+6,PX1-6),clamp(p.y+dyv*30,PY0+10,PY1-10),1);
}
function aiOutfield(p,dt){
  if(ball.owner===p){aiCarrier(p,dt);return}
  const t=p.team,pt=possTeam();let tx,ty,sf=0.85;const h=homePos(p);tx=h.x;ty=h.y;
  if(!ball.owner&&(ball.passTarget===p||t.chaser===p)){const ip=interceptPoint(p);tx=ip.x;ty=ip.y;sf=1}
  else if(pt===t){sf=0.8;const c=ball.owner;if(c&&c!==p){const d=dist(c,p);if(d<35&&d>0.1){tx+=(p.x-c.x)/d*20;ty+=(p.y-c.y)/d*20}}if(p.role==='FWD')tx+=t.side*18}
  else if(pt){if(t.chaser===p){const ip=interceptPoint(p);tx=ip.x;ty=ip.y;sf=1;tryTackle(p)}
    else if(t.support===p){const g=ownGoalX(t);tx=ball.x+(g-ball.x)*0.15;ty=ball.y+(GCY-ball.y)*0.15;sf=0.95}}
  moveTo(p,clamp(tx,PX0-10,PX1+10),clamp(ty,PY0-8,PY1+8),sf);
}
function aiGK(p,dt){
  const t=p.team,g=ownGoalX(t),s=t.side;
  if(ball.owner===p){p.tvx=p.tvy=0;p.hold-=dt;if(p.hold<=0){if(G.training&&!t.human){trainingReset();return}const m=bestPassTarget(p,true)||t.players[pick([2,3,6,7])];pass(p,m,dist(p,m)>150?'lob':'auto')}return}
  const db=hyp(ball.x-g,ball.y-GCY);
  let tx=g+s*(6+(db<200?(200-db)*0.06:0)),ty=clamp(GCY+(ball.y-GCY)*0.5,GCY-GOAL_HALF+3,GCY+GOAL_HALF-3),sf=1.05;
  const inBox=inOwnBox(p,ball),bs=hyp(ball.vx,ball.vy);
  if(inBox&&!ball.shot&&((!ball.owner&&bs<200)||(ball.owner&&ball.owner.team!==t&&dist(p,ball)<50))){const ip=interceptPoint(p);tx=ip.x;ty=ip.y;sf=1.15;tryTackle(p,t.ai.gk*0.6)}
  if(!ball.owner&&ball.shot&&ball.vx*s<0){const tt=(g-ball.x)/ball.vx;if(tt>0&&tt<1.5){ty=clamp(ball.y+ball.vy*tt,GCY-GOAL_HALF-4,GCY+GOAL_HALF+4);tx=g+s*5;sf=1.2}}
  moveTo(p,tx,ty,sf);
  if(!ball.owner&&ball.shot&&ball.shotTeam!==t&&!ball.saveChecked&&ball.vx*s<0&&ball.z<24){const d=dist(p,ball);
    if(d<18){ball.saveChecked=true;const ch=t.ai.gk+0.16-(bs-380)/900-(d>12?0.12:0)+((p.at?p.at.gkr:75)-75)/250;p.dive=0.5;p.diveDir=Math.sign(ball.y-p.y)||1;
      if(Math.random()<ch){if(bs<360&&Math.random()<0.6){take(p);sfx.tackle()}else{ball.vx=-ball.vx*0.3+s*40;ball.vy=ball.vy*0.3+rnd(-1,1)*140;ball.vz=70;ball.shot=false;ball.lastTouch=p;p.kickCd=0.4;sfx.kick()}}
      else p.stun=0.6;}}
}

/* ---------- human ---------- */
const shootZone=p=>rfx(p.team,p.x)>0.5;
function humanControl(p,dt){
  const m=inpMag(),has=ball.owner===p,o=ball.owner,opp=o&&o.team!==p.team;
  const myFlight=!o&&ball.passTeam===p.team;
  if(has&&G.q){const q=G.q;G.q=null;if(q.k==='pass')humanPass(p,false);else if(q.k==='thru')humanPass(p,true);else if(shootZone(p))shoot(p,0.55,inp.y*1.1);else clearance(p);return}
  const spr=inp.sprintHeld?(has?1.22:1.35):1;
  if(!has&&myFlight&&ball.passTarget===p){const ip=interceptPoint(p);moveTo(p,ip.x,ip.y,inp.sprintHeld?1.3:1.1)}
  else if(!has&&inp.thruHeld&&!myFlight&&!(o&&o.team===p.team)){

/* ---------- physics ---------- */
function tick(p,dt){p.kickCd-=dt;p.tackleCd-=dt;p.stun=Math.max(0,p.stun-dt);p.dive=Math.max(0,p.dive-dt);p.fallen=Math.max(0,p.fallen-dt)}

  }

const CAM={x:CX,ty:GCY,cy:PY1+215,cz:190,cos:1,sin:0,f:800};

function recordMatch(){const h=humanTeam();if(!h||G.training||G.recorded)return;G.recorded=true;const o=other(h),gf=h.score,ga=o.score,r=gf>ga?'w':gf<ga?'l':'d';
  stats.matches++;stats[r]++;stats.gf+=gf;stats.ga+=ga;stats.clubs[h.key]=(stats.clubs[h.key]||0)+1;stats.mostGoals=Math.max(stats.mostGoals,gf);
  stats.history.unshift({d:today(),me:h.key,op:o.key,gf,ga,df:settings.diff});stats.history=stats.history.slice(0,30);
  if(r==='w'&&(!stats.bestWin||gf-ga>stats.bestWin.gf-stats.bestWin.ga||(gf-ga===stats.bestWin.gf-stats.bestWin.ga&&gf>stats.bestWin.gf)))stats.bestWin={gf,ga,me:h.key,op:o.key,d:today()};
  if(r==='w'){unlock('first_win');if(ga===0)unlock('clean');if(gf-ga>=3)unlock('big_win');if(G.trailed)unlock('comeback');if(settings.diff==='hard')unlock('hard_win')}
  if(Object.values(G.mg).some(n=>n>=3))unlock('hattrick');if(stats.matches>=10)unlock('m10');if(stats.matches>=50)unlock('m50');saveStats()}

function hexTile(stroke,fill){const r=13,w=Math.round(3*r),h=Math.round(Math.sqrt(3)*r),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const hex=(cx,cy)=>{x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;x.lineTo(cx+Math.cos(a)*(r-1.2),cy+Math.sin(a)*(r-1.2))}x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=1.2;x.stroke()}};
  for(const [cx,cy] of [[0,0],[w,0],[0,h],[w,h],[1.5*r,h/2],[1.5*r,-h/2],[1.5*r,1.5*h]])hex(cx,cy);return `url(${c.toDataURL()})`}
try{document.documentElement.style.setProperty('--hex',hexTile('rgba(255,255,255,.09)'));document.documentElement.style.setProperty('--hexg',hexTile('rgba(255,215,60,.35)','rgba(255,200,40,.22)'))}catch(e){}

  :`<div class="kv"><span>Стрелки / WASD</span><b>бег</b></div><div class="kv"><span>X</span><b>пас / курсор</b></div><div class="kv"><span>C</span><b>вразрез / сопровождать</b></div><div class="kv"><span>Z / Пробел</span><b>удар / подкат</b></div><div class="kv"><span>Shift</span><b>рывок / прессинг</b></div><div class="kv"><span>P</span><b>пауза</b></div>`;
 openSub('about','Об игре',`<div class="pnl wide"><div class="big">Пиксель Футбол '95</div><div class="unit" style="margin:4px 0 0">Версия 0.9 · ретро-футбол в духе 90-х</div></div>
 <div class="pnl"><div class="ph">Управление</div>${help}</div>
 <div class="pnl"><div class="ph">Титры</div><div class="kv"><span>Идея и тестирование</span><b>elturista0</b></div><div class="kv"><span>Код, графика, звук</span><b>Claude</b></div><div class="kv"><span>Движок</span><b>свой, HTML5 Canvas</b></div><div class="kv"><span>Звуки</span><b>синтез в игре</b></div></div>
 <div class="pnl wide"><div class="ph">Примечание</div><div class="muted">Все клубы, имена игроков и рекламные щиты вымышлены, совпадения случайны.</div></div>`)}
buildHome();

let lastMode='match';
function hideScreens(){['#home','#sub','#end','#pause'].forEach(q=>$(q).classList.add('hidden'))}
function startGame(mode){if(typeof mode!=='string')mode=lastMode;lastMode=mode;auInit();hideScreens();ui.classList.remove('hidden');newTro=[];newMatch(mode==='training');running=true;paused=false;
  if(mode==='training')stats.training.sessions++;markDay();fit();
  if(isTouch){try{const d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen;if(rq&&!document.fullscreenElement){const pr=rq.call(d);if(pr&&pr.then)pr.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}}catch(e){}}}
$('#again').onclick=()=>startGame(lastMode);
function toMenu(){saveStats();running=false;paused=false;G=null;ui.classList.add('hidden');hideScreens();$('#home').classList.remove('hidden');selHome(homeSel,true);fit()}
$('#quit').onclick=toMenu;$('#toMenu').onclick=toMenu;
function setPause(v){if(!running)return;paused=v;$('#pause').classList.toggle('hidden',!v);if(v)saveStats()}
$('#bPause').addEventListener('click',()=>setPause(true));$('#resume').onclick=()=>{auInit();setPause(false)};
$('#sound').onclick=()=>setOpt('sound',!AU.on);
document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause(true);saveStats()}});
function showEnd(){const a=teams[0],b=teams[1],h=humanTeam();$('#endScore').textContent=`${a.kit.name} ${a.score} : ${b.score} ${b.kit.name}`;
  let r='Ничья';if(h){const d=h.score-other(h).score;r=d>0?'Победа! 🏆':d<0?'Поражение':'Ничья'}$('#endRes').textContent=r;recordMatch();
  $('#endTro').textContent=newTro.length?'Новый трофей: '+newTro.map(id=>{const t=TROPHIES.find(x=>x[0]===id);return t[1]+' '+t[2]}).join(', '):'';ui.classList.add('hidden');$('#end').classList.remove('hidden')}

// joystick
const stick=$('#stick'),base=$('#base'),knob=$('#knob');let sid=null,sx0=0,sy0=0;
function stUpd(e){let dx=e.clientX-sx0,dy=e.clientY-sy0;const d=hyp(dx,dy),RR=70;if(d>RR){dx=dx/d*RR;dy=dy/d*RR}knob.style.transform=`translate(${dx}px,${dy}px)`;inp.tx=dx/RR;inp.ty=dy/RR}
stick.addEventListener('pointerdown',e=>{e.preventDefault();auInit();sid=e.pointerId;try{stick.setPointerCapture(sid)}catch(_){}if(settings.stick==='fixed'){const br=base.getBoundingClientRect();sx0=br.left+br.width/2;sy0=br.top+br.height/2}else{const r=stick.getBoundingClientRect();sx0=e.clientX;sy0=e.clientY;base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px'}stUpd(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stUpd(e)});
const stEnd=e=>{if(e.pointerId!==sid)return;sid=null;inp.tx=inp.ty=0;knob.style.transform='';base.style.left='';base.style.top=''};
stick.addEventListener('pointerup',stEnd);stick.addEventListener('pointercancel',stEnd);
function bindBtn(el,dn,up){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('down');dn()});
  const u=()=>{if(!el.classList.contains('down'))return;el.classList.remove('down');up()};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('lostpointercapture',u)}
bindBtn(b1,()=>{inp.thruHit=true;inp.thruHeld=true},()=>{inp.thruHeld=false});
bindBtn(b2,()=>{inp.shootHit=true;inp.shootHeld=true},()=>{inp.shootHeld=false;inp.shootRel=true});
bindBtn(b3,()=>{inp.passHit=true},()=>{});
bindBtn(b4,()=>{inp.sprintHeld=true},()=>{inp.sprintHeld=false});
// keyboard
const KX={ArrowLeft:-1,KeyA:-1,ArrowRight:1,KeyD:1},KY={ArrowUp:-1,KeyW:-1,ArrowDown:1,KeyS:1};
function keyAxes(){let x=0,y=0;for(const k in inp.keys)if(inp.keys[k]){if(KX[k])x+=KX[k];if(KY[k])y+=KY[k]}inp.kx=clamp(x,-1,1);inp.ky=clamp(y,-1,1)}
addEventListener('keydown',e=>{if(!running){const hv=!$('#home').classList.contains('hidden'),sv=!$('#sub').classList.contains('hidden');
    if(hv){if(e.code==='ArrowRight'||e.code==='KeyD'){selHome(homeSel+1);return}if(e.code==='ArrowLeft'||e.code==='KeyA'){selHome(homeSel-1);return}if(e.code==='Enter'||e.code==='Space'){auInit();openItem(homeSel);e.preventDefault();return}}
    if(sv&&(e.code==='Escape'||e.code==='Backspace')){backHome();return}}
  if(e.code in KX||e.code in KY){inp.keys[e.code]=true;keyAxes();e.preventDefault()}
  if(e.repeat)return;if(e.code==='KeyX'||e.code==='KeyJ'){inp.passHit=true;auInit()}
  if(e.code==='KeyZ'||e.code==='KeyK'||e.code==='Space'){inp.shootHit=true;inp.shootHeld=true;e.preventDefault()}
  if(e.code==='KeyC'||e.code==='KeyL'){inp.thruHit=true;inp.thruHeld=true}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')inp.sprintHeld=true;
  if(e.code==='KeyP'||e.code==='Escape')setPause(!paused)});
addEventListener('keyup',e=>{if(e.code in KX||e.code in KY){inp.keys[e.code]=false;keyAxes()}if(e.code==='KeyZ'||e.code==='KeyK'||e.code==='Space'){inp.shootHeld=false;inp.shootRel=true}
  if(e.code==='KeyC'||e.code==='KeyL')inp.thruHeld=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')inp.sprintHeld=false});
document.addEventListener('touchmove',e=>{if(running)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

let lastLbl='';
function updLabels(){if(!G)return;const c=G.ctrl;
  const has=c&&ball.owner===c,flight=c&&!ball.owner&&ball.passTeam===c.team;
  const def=G.state==='play'&&c&&!has&&!flight;
  const sh=!def&&c&&(G.state!=='play'||shootZone(c));
  const l=(def?'d':'a')+(sh?'s':'c');
  if(l!==lastLbl){lastLbl=l;pad.classList.toggle('def',!!def);b2.classList.toggle('shoot',!!sh&&!def);
    if(def){b1.innerHTML='Сопро-<br>вождать';b2.textContent='Подкат';b3.textContent='Курсор';b4.innerHTML='Рывок и<br>прессинг'}
    else{b1.textContent='Вразрез';b2.textContent=sh?'Удар':'Вынос';b3.textContent='Пас';b4.textContent='Рывок'}}
  const wait=(G.state==='setpiece'&&G.ready&&G.sp.team.human&&G.sp.taker===c)||(G.state==='kickoff'&&G.kickTeam.human&&G.timer>0.4);b3.classList.toggle('pulse',!!wait)}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,secAcc=0;
function frame(now){try{const d=Math.min(0.1,(now-last)/1000);last=now;
  if(running&&!paused){acc+=d;while(acc>=STEP){step(STEP);acc-=STEP}stats.seconds+=d;secAcc+=d;if(secAcc>20){secAcc=0;saveStats()}}else acc=0;
  if(innerWidth!==fitW||innerHeight!==fitH)fit();
  render();updLabels()}catch(e){lastErr=String(e&&e.message||e);acc=0}finally{requestAnimationFrame(frame)}}
document.addEventListener('fullscreenchange',()=>setTimeout(fit,120));
cv.addEventListener('contextrestored',()=>{try{buildTextures()}catch(e){}});
buildTextures();fit();requestAnimationFrame(frame);

window.__PF={inp,settings,CLUBS,LEAGUES,squadOf,xiOf,teamOvr,newMatch,step:n=>{for(let i=0;i<n;i++)step(STEP)},get G(){return G},get teams(){return teams},get ball(){return ball},get all(){return all},render};
})();
